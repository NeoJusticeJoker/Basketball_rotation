<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="籃球輪替">
<title>輪替表 · 籃球上場時間調度</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF1EC; --panel:#FFFFFF; --ink:#14171A; --rule:#CDD1C6; --muted:#6E756A;
  --hi:#C9F24D; --hi-edge:#A6CF2C; --alert:#FF4438;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --ui:system-ui,-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:inherit}

header{background:var(--ink);color:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:baseline;gap:10px}
header h1{margin:0;font-family:var(--num);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
header .fmt{font-family:var(--num);font-size:15px;letter-spacing:.08em;color:var(--hi);margin-left:auto}

nav.tabs{display:flex;background:var(--ink);border-bottom:3px solid var(--ink)}
nav.tabs button{flex:1;background:none;border:0;padding:11px 4px 13px;color:#8E948B;font-weight:600;
  font-size:14px;letter-spacing:.05em;border-bottom:3px solid transparent;margin-bottom:-3px}
nav.tabs button[aria-selected=true]{color:var(--paper);border-bottom-color:var(--hi)}

main{padding:14px 12px 90px;max-width:720px;margin:0 auto}
h2.sec{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin:22px 0 8px;text-transform:uppercase}
h2.sec:first-child{margin-top:2px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 0}

.btn{border:2px solid var(--ink);background:var(--panel);border-radius:2px;padding:11px 14px;font-weight:600;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.hi{background:var(--hi);border-color:var(--ink)}
.btn.ghost{border-color:var(--rule);color:var(--muted);background:transparent}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn small{display:block;font-weight:400;font-size:11.5px;opacity:.75;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}

.clockbox{background:var(--ink);color:var(--paper);border-radius:3px;padding:14px 16px 16px;text-align:center}
.clockbox .q{font-family:var(--num);font-size:16px;letter-spacing:.22em;color:var(--hi);
  display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hi);display:inline-block}
.dot.run{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.clockbox .t{font-family:var(--num);font-weight:700;font-size:82px;line-height:.92;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin:2px 0 4px}
.clockbox .sub{font-size:12px;color:#9AA096;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}

.warn{background:var(--alert);color:#fff;font-weight:700;font-size:13.5px;padding:8px 12px;border-radius:2px;margin:10px 0 0}
.plist{display:flex;flex-direction:column;gap:6px}
.pcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--rule);
  background:var(--panel);border-radius:2px;padding:9px 12px;min-height:54px}
.pcard.on{background:var(--hi);border-color:var(--ink)}
.pcard .no{font-family:var(--num);font-weight:700;font-size:24px;min-width:34px;text-align:center}
.pcard .nm{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .mi{font-family:var(--num);font-size:22px;font-weight:600}
.pcard .mi small{font-family:var(--ui);font-size:11px;font-weight:400;color:var(--muted)}
.pcard.on .mi small{color:#4A5241}
.pcard .role{font-size:11px;color:var(--muted);border:1px solid var(--rule);padding:1px 5px;border-radius:2px;white-space:nowrap}
.pcard.on .role{border-color:#8FB332;color:#3F4A2C}
.pcard .role b{font-family:var(--num);font-size:13px;font-weight:700}

.qtabs{display:flex;gap:6px;margin-bottom:8px}
.qtabs button{flex:1;border:2px solid var(--rule);background:var(--panel);border-radius:2px;padding:8px 0;
  font-family:var(--num);font-size:18px;font-weight:600;min-height:40px}
.qtabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--ink);border-radius:3px;background:var(--panel)}
.grid{display:grid;min-width:100%;touch-action:pan-y}
.grid>*{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grid .hcell{font-family:var(--num);font-size:12px;color:var(--muted);text-align:center;padding:3px 0;background:#E7EAE2}
.grid .name{position:sticky;left:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:5px;
  padding:0 6px;border-right:2px solid var(--ink);font-size:13px;overflow:hidden}
.grid .name.st{box-shadow:inset 4px 0 0 var(--ink)}
.grid .name b{font-family:var(--num);font-size:16px;min-width:18px;text-align:right}
.grid .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grid .name i{font-family:var(--num);font-style:normal;font-size:15px;font-weight:600;color:var(--muted)}
.grid .cell{background:var(--panel);height:34px;padding:0;border-radius:0}
.grid .cell.on{background:var(--hi);box-shadow:inset 0 0 0 1px var(--hi-edge)}
.grid .cell.on.s{border-top-left-radius:9px;border-bottom-left-radius:9px}
.grid .cell.on.e{border-top-right-radius:9px;border-bottom-right-radius:9px}
.grid .cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.grid .cnt{font-family:var(--num);font-size:15px;font-weight:600;text-align:center;background:#E7EAE2;padding:3px 0}
.grid .cnt.bad{background:var(--alert);color:#fff}
.grid .name.foot{font-size:11px;color:var(--muted);letter-spacing:.08em;background:#E7EAE2}

table{width:100%;border-collapse:collapse;background:var(--panel);border:2px solid var(--ink);border-radius:3px}
th,td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:right;font-size:14px}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);background:#E7EAE2;font-weight:700}
th:first-child,td:first-child{text-align:left}
td.n{font-family:var(--num);font-size:18px;font-weight:600}
td .diff{font-family:var(--num);font-size:13px;margin-left:3px}
.pos{color:#2F7A2A}.neg{color:var(--alert)}
tr.tot td{background:#E7EAE2;font-weight:700}

.rrow{display:grid;grid-template-columns:50px 1fr 66px 72px;gap:5px;margin-bottom:6px}
.rrow input,.rrow select{border:2px solid var(--rule);border-radius:2px;padding:9px 6px;background:var(--panel);
  min-height:44px;width:100%}
.rrow input:focus,.rrow select:focus{outline:none;border-color:var(--ink)}
.pastebox{width:100%;min-height:130px;border:2px solid var(--rule);border-radius:2px;padding:10px;background:var(--panel);font:13px ui-monospace,monospace}
.rhead{display:grid;grid-template-columns:50px 1fr 66px 72px;gap:5px;font-size:11px;color:var(--muted);
  letter-spacing:.06em;margin-bottom:4px;padding:0 2px}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.wrow input{border:2px solid var(--rule);border-radius:2px;padding:9px;width:100%;min-height:44px}
.board{width:100%;height:auto;display:block;background:var(--panel);border:2px solid var(--ink);
  border-radius:3px;touch-action:none;user-select:none;max-width:420px;max-height:58vh;margin:0 auto}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.tools button{border:2px solid var(--rule);background:var(--panel);border-radius:2px;padding:7px 2px;
  font-size:13px;font-weight:600;min-height:44px}
.tools button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.plays{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.plays .pl{border:2px solid var(--ink);background:var(--panel);border-radius:2px;padding:8px 10px;
  font-weight:600;font-size:13.5px;min-height:44px;display:flex;align-items:center;gap:6px}
.plays .pl[aria-selected=true]{background:var(--hi)}
.plays .pl b{font-weight:400;color:var(--muted);font-size:11px}
.steps{background:var(--panel);border:2px solid var(--ink);border-radius:3px;padding:10px 12px;margin-top:10px}
.steps li{font-size:13.5px;margin:3px 0}
.steps h3{margin:0 0 6px;font-size:14px}
.seg{display:flex;gap:0;border:2px solid var(--ink);border-radius:2px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--panel);padding:9px 4px;font-weight:600;font-size:13.5px;min-height:42px}
.seg button[aria-selected=true]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>

<header>
  <h1>ROTATION</h1>
  <span class="fmt num" id="fmtBadge">40 MIN</span>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="live"  aria-selected="true">即時</button>
  <button data-tab="plan"  aria-selected="false">預排</button>
  <button data-tab="stat"  aria-selected="false">統計</button>
  <button data-tab="board" aria-selected="false">戰術</button>
  <button data-tab="setup" aria-selected="false">名單</button>
</nav>

<main id="view"></main>
<input type="file" id="impFile" accept=".json,application/json" style="position:absolute;left:-9999px">

<script>
"use strict";

/* ═════════ 資料 ═════════
   時間一律整數（分鐘 / 毫秒），不做浮點累加。
   grid[節][分] = [在場球員 id]：該分鐘結束時的場上五人。
   plan 與 live 兩張獨立的表，互不覆蓋。                       */

const LS = 'hoop-rotation-v2';
const LS_OLD = 'hoop-rotation-v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const ROLES = { S: '先發', R: '輪替' };
const POS = ['PG', 'SG', 'SF', 'PF', 'C'];
const ALGO = 12;     // 自動預排演算法版本：舊版排的表要提醒重排

const blankRoster = () => Array.from({ length: 15 }, (_, i) =>
  ({ id: uid(), no: '', name: '', role: i < 5 ? 'S' : 'R', pos: POS[i % 5] }));
const blankGrid = qm => Array.from({ length: 4 }, () => Array.from({ length: qm }, () => []));
const fitGrid = (grid, qm) => Array.from({ length: 4 }, (_, q) =>
  Array.from({ length: qm }, (_, m) => Array.isArray(grid && grid[q] && grid[q][m]) ? grid[q][m] : []));

function defaults() {
  return {
    fmt: 40, qMin: 10,
    roster: blankRoster(),
    w: { S: 1.5, R: 1 },
    plan: blankGrid(10), live: blankGrid(10), flex: { restMin: 2, restStarters: 5 }, templates: [],
    lv: { q: 0, acc: 0, startedAt: null, running: false, onCourt: [], written: 0 },
    tab: 'live', gq: 0, showLiveGrid: false, scope: 'all',
    planAlgo: ALGO, planScen: '',
    board: { full: false, tool: 'drag', tokens: [], marks: [], play: '' },
    freeBoard: { full: false, tool: 'drag', tokens: [], marks: [], play: '' }, boardMode: 'library', plays: []
  };
}

let S = defaults();
(function load() {
  let raw = localStorage.getItem(LS) || localStorage.getItem(LS_OLD);
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    S = Object.assign(defaults(), o);
    const migrated32 = +o.fmt === 32 || +o.qMin === 8;
    if (migrated32) { S.fmt = 40; S.qMin = 10; }
    else if (![10, 12].includes(+S.qMin)) S.qMin = S.fmt === 48 ? 12 : 10;
    S.fmt = S.fmt === 48 ? 48 : 40;
    S.flex = Object.assign(defaults().flex, o.flex || {});
    S.flex.restMin = Math.min(S.qMin - 1, Math.max(0, Math.floor(+S.flex.restMin || 0)));
    S.flex.restStarters = Math.min(5, Math.max(1, Math.floor(+S.flex.restStarters || 1)));
    S.templates = Array.isArray(o.templates) ? o.templates : [];
    S.lv = Object.assign(defaults().lv, o.lv || {});
    S.w = { S: +(o.w && o.w.S) || 1.5, R: +(o.w && o.w.R) || 1 };
    // v1 → v2：板凳併入輪替、補上位置欄
    S.roster = (o.roster || blankRoster()).slice(0, 15).map((p, i) => ({
      id: p.id || uid(), no: p.no || '', name: p.name || '',
      role: p.role === 'S' ? 'S' : 'R',
      pos: POS.indexOf(p.pos) >= 0 ? p.pos : POS[i % 5]
    }));
    while (S.roster.length < 15) S.roster.push({ id: uid(), no: '', name: '', role: 'R', pos: POS[S.roster.length % 5] });
    S.plan = fitGrid(o.plan, S.qMin); S.live = fitGrid(o.live, S.qMin);
    S.lv.running = false; S.lv.startedAt = null;   // 重新載入一律停錶
    S.stalePlan = (migrated32 || o.planAlgo !== ALGO) && S.plan.some(q => q.some(m => m.length));
    S.board = Object.assign(defaults().board, o.board || {});
    S.freeBoard = Object.assign(defaults().freeBoard, o.freeBoard || {});
    S.boardMode = o.boardMode === 'free' ? 'free' : 'library';
    S.plays = Array.isArray(o.plays) ? o.plays : [];
  } catch (e) { S = defaults(); }
})();

let saveTimer = null;
const activeBoard = () => S.boardMode === 'free' ? S.freeBoard : S.board;
function save(now) {
  clearTimeout(saveTimer);
  const doIt = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
  now ? doIt() : (saveTimer = setTimeout(doIt, 250));
}

const actives = () => S.roster.filter(p => String(p.no).trim() || p.name.trim());
const gameMin = () => S.qMin * 4;
const seatMin = () => S.qMin * 4 * 5;

function minutesOf(src, id) {
  const g = S[src]; let t = 0; const q = [0, 0, 0, 0];
  for (let i = 0; i < 4; i++) for (let m = 0; m < S.qMin; m++)
    if (g[i][m].indexOf(id) >= 0) { t++; q[i]++; }
  return { total: t, q };
}
function suggestions() {
  const ps = actives();
  const sum = ps.reduce((a, p) => a + (+S.w[p.role] || 0), 0);
  const out = {};
  ps.forEach(p => out[p.id] = sum > 0 ? Math.min(gameMin(), Math.round(seatMin() * (+S.w[p.role] || 0) / sum)) : 0);
  return out;
}

/* ═════════ 輪替情境 ═════════
   每節切成若干「輪換區」：[起, 迄, 這段安排休息的先發人數]，比例存，40/48 制通用。
   k=0 代表先發全留場；人人有份模式則忽略位置與先發身分，按累計分鐘輪替。 */
const SCEN = {
  equal: { name: '人人有份', desc: '每段約 5–6 分鐘，至少留 2 名先發', z: null },
  balanced: { name: '均衡輪替', desc: 'Q1 先發打 8 分鐘，替補輪替延續全場', z: [
    [[0, .8, 0], [.8, 1, 3]], [[0, .2, 3], [.2, .4, 0], [.4, 1, 2]],
    [[0, .8, 2], [.8, 1, 3]], [[0, .2, 3], [.2, 1, 2]] ] },
  custom: { name: '自訂輪替', desc: '依下方設定輪休時間與人數', z: null },
  tight: { name: '拉鋸戰', desc: 'Q1 8 分鐘先發主打、Q4 最後 2 分鐘全主力收尾', z: [
    [[0, .8, 0], [.8, 1, 2]], [[0, .2, 2], [.2, .4, 0], [.4, .8, 2], [.8, 1, 0]],
    [[0, .8, 3], [.8, 1, 2]], [[0, .2, 2], [.2, .8, 2], [.8, 1, 0]] ] },
  lead:  { name: '大幅領先', desc: '各節都讓替補輪替，第四節增加替補時段', z: [
    [[0, .8, 0], [.8, 1, 3]], [[0, .2, 3], [.2, .4, 0], [.4, 1, 2]],
    [[0, .8, 2], [.8, 1, 3]], [[0, .2, 3], [.2, .6, 3], [.6, 1, 2]] ] },
  trail: { name: '大幅落後', desc: '先給替補輪替，第四節最後 2 分鐘全主力收尾', z: [
    [[0, .8, 0], [.8, 1, 3]], [[0, .2, 3], [.2, .4, 0], [.4, 1, 2]],
    [[0, .8, 2], [.8, 1, 3]], [[0, .2, 3], [.2, .6, 3], [.6, .8, 2], [.8, 1, 0]] ] }
};
const REST_ORDER = ['C', 'PF', 'SG', 'SF', 'PG'];   // 先讓內線休息，控球留到最後
const MIN_CHUNK = 3;                                 // 一次下場休息至少幾分鐘

const zonesOf = (q, key) => {
  const z = key === 'custom' ? (() => {
    const r = Math.min(S.qMin - 1, Math.max(0, +S.flex.restMin || 0)) / S.qMin;
    const k = Math.min(5, Math.max(1, +S.flex.restStarters || 1));
    return q % 2 === 0 ? [[0, 1 - r, 0], [1 - r, 1, k]] : [[0, r, k], [r, 1, 0]];
  })() : SCEN[key].z[q];
  return z.map(([a, b, k]) => ({ from: Math.round(a * S.qMin), to: Math.round(b * S.qMin), k }))
    .filter(zone => zone.to > zone.from);
};

function autoPlan(key, onlyQ4) {
  const ps = actives();
  if (ps.length < 5) { alert('至少要有 5 個人才能自動預排。'); return false; }
  const qs = onlyQ4 ? [3] : [0, 1, 2, 3];
  qs.forEach(q => { S.plan[q] = Array.from({ length: S.qMin }, () => []); });

  if (key === 'equal') {
    const mins = {}; ps.forEach(p => mins[p.id] = minutesOf('plan', p.id).total);
    let prev = onlyQ4 ? new Set(S.plan[2][S.qMin - 1] || []) : new Set();
    let rotation = 0;
    const starters = ps.filter(p => p.role === 'S');
    const startAbs = onlyQ4 ? 3 * S.qMin : 0, endAbs = 4 * S.qMin;
    const total = endAbs - startAbs, shifts = Math.ceil(total / 6);
    const base = Math.floor(total / shifts), longer = total % shifts;
    let start = startAbs;
    for (let shift = 0; shift < shifts; shift++) {
      const len = base + (shift < longer ? 1 : 0), end = start + len;
      const ranked = ps.slice().sort((a, b) => {
        if (mins[a.id] !== mins[b.id]) return mins[a.id] - mins[b.id];
        if (prev.has(a.id) !== prev.has(b.id)) return prev.has(a.id) ? -1 : 1;
        const ia = (ps.indexOf(a) - rotation % ps.length + ps.length) % ps.length;
        const ib = (ps.indexOf(b) - rotation % ps.length + ps.length) % ps.length;
        return ia - ib;
      });
      const chosen = ranked.slice(0, 5);
      const minStarters = Math.min(2, starters.length);
      while (chosen.filter(p => p.role === 'S').length < minStarters) {
        const nextStarter = ranked.find(p => p.role === 'S' && !chosen.includes(p));
        const replace = chosen.slice().reverse().find(p => p.role !== 'S');
        if (!nextStarter || !replace) break;
        chosen.splice(chosen.indexOf(replace), 1, nextStarter);
      }
      const lineup = chosen.map(p => p.id);
      for (let abs = start; abs < end; abs++) {
        const q = Math.floor(abs / S.qMin), m = abs % S.qMin;
        S.plan[q][m] = lineup.slice();
      }
      lineup.forEach(id => mins[id] += len);
      prev = new Set(lineup); rotation++; start = end;
    }
    S.planAlgo = ALGO; S.stalePlan = false;
    S.planScen = SCEN[key].name + (onlyQ4 ? '（只換第 4 節）' : '（全場）');
    return true;
  }

  // PG/SG 共用後衛輪替池，兩個先發後衛可互相補位。
  const main = {}, subs = {};
  const guards = ps.filter(p => p.pos === 'PG' || p.pos === 'SG');
  const guardStarters = guards.filter(p => p.role === 'S');
  main.PG = guardStarters[0] || guards[0] || null;
  main.SG = guardStarters.find(p => p.id !== (main.PG && main.PG.id))
    || guards.find(p => p.id !== (main.PG && main.PG.id)) || null;
  ['SF', 'PF', 'C'].forEach(P => {
    const same = ps.filter(p => p.pos === P);
    main[P] = same.find(p => p.role === 'S') || same[0] || null;
  });
  POS.forEach(P => {
    const same = (P === 'PG' || P === 'SG') ? guards : ps.filter(p => p.pos === P);
    subs[P] = same.filter(p => !main[P] || p.id !== main[P].id);
  });
  const mainIds = new Set(POS.map(P => main[P] && main[P].id).filter(Boolean));
  const benchAll = ps.filter(p => !mainIds.has(p.id));

  /* ── 步驟 1：列出所有「輪換區」的分鐘，記下該分鐘容許幾個先發休息 ── */
  const mainStarters = POS.map(P => main[P]).filter(p => p && p.role === 'S').length;
  const maxStartersToRest = Math.min(benchAll.length, Math.max(0, mainStarters - Math.min(2, mainStarters)));
  const tl = [];                                   // {q, m, k, abs}
  qs.forEach(q => zonesOf(q, key).forEach(z => {
    const k = Math.min(z.k, maxStartersToRest);
    for (let m = z.from; m < z.to; m++) tl.push({ q, m, k, abs: q * S.qMin + m });
  }));
  const rest = tl.map(() => new Set());

  /* ── 步驟 2：每條「車道」代表同時休息的一個名額。
        把車道切成 3～6 分鐘的區塊輪流分給各位置，
        各車道的起始長度差 1 分鐘 → 換人時機自然錯開，一次只動 1 人 ── */
  const order = REST_ORDER.filter(P => main[P] && (subs[P].length || benchAll.length));
  const CHUNK = Math.max(4, Math.round(S.qMin * 0.4));
  const absRest = {};                              // 絕對分鐘 -> 該分鐘休息中的位置
  tl.forEach((c, i) => absRest[c.abs] = rest[i]);
  const restMin = {}; POS.forEach(P => restMin[P] = 0);
  // 同一人兩段休息之間至少要打 MIN_CHUNK 分鐘；緊鄰的休息可以接續延長，不算違規
  const gapOK = (P, from, dir) => {
    for (let x = from, n = 0; x >= 0 && x < 4 * S.qMin; x += dir, n++) {
      if (dir < 0 && x < 2 * S.qMin) return true;  // 中場休息視為恢復，不跨中場檢查
      if (dir > 0 && x >= 2 * S.qMin) return true;
      if (absRest[x] && absRest[x].has(P)) return n === 0 || n >= MIN_CHUNK;
      if (n + 1 >= MIN_CHUNK) return true;
    }
    return true;
  };
  const clash = (P, slice) => {
    const a = tl[slice[0]].abs, b = tl[slice[slice.length - 1]].abs;
    for (let x = a; x <= b; x++) if (absRest[x] && absRest[x].has(P)) return true;
    return !gapOK(P, a - 1, -1) || !gapOK(P, b + 1, 1);
  };

  const chunks = [];
  for (let lane = 0; lane < 5 && order.length; lane++) {
    const idx = tl.map((c, i) => c.k > lane ? i : -1).filter(i => i >= 0);
    if (!idx.length) continue;
    const segs = [];                               // 切成時間上連續的段
    idx.forEach(i => {
      const s = segs[segs.length - 1];
      const prevZone = s && tl[s[s.length - 1]];
      const halfTimeBreak = prevZone && prevZone.q === 1 && tl[i].q === 2;
      if (s && !halfTimeBreak && tl[i].abs === prevZone.abs + 1) s.push(i); else segs.push([i]);
    });
    segs.forEach(seg => {
      let p = 0, first = true;
      while (p < seg.length) {
        let len = Math.min(first ? MIN_CHUNK + lane : CHUNK, seg.length - p);
        if (seg.length - p - len > 0 && seg.length - p - len < MIN_CHUNK) len = seg.length - p;
        chunks.push(seg.slice(p, p + len));
        p += len; first = false;
      }
    });
  }
  // 依時間先後統一分派，各車道才不會互相把名額卡死
  chunks.sort((x, y) => tl[x[0]].abs - tl[y[0]].abs || x.length - y.length);
  chunks.forEach(slice => {
    let best = null;                               // 挑累計休息最少的位置，休息時間才會平均
    order.forEach(c => {
      if (clash(c, slice)) return;
      if (!best || restMin[c] < restMin[best]) best = c;
    });
    if (best) { slice.forEach(i => rest[i].add(best)); restMin[best] += slice.length; }
  });

  /* ── 步驟 3：逐分鐘組陣容，休息中的位置由同位置替補頂上 ── */
  const restAt = {};
  tl.forEach((c, i) => restAt[c.q + '_' + c.m] = rest[i]);
  const mins = {}; ps.forEach(p => mins[p.id] = minutesOf('plan', p.id).total);
  const filler = {};
  let prev = onlyQ4 ? new Set(S.plan[2][S.qMin - 1] || []) : new Set();
  const fewest = arr => arr.slice().sort((a, b) =>
    (prev.has(b.id) - prev.has(a.id)) || (mins[a.id] - mins[b.id]) || a.id.localeCompare(b.id))[0];

  qs.forEach(q => {
    if (q === 2) { POS.forEach(P => filler[P] = null); prev = new Set(); }
    for (let m = 0; m < S.qMin; m++) {
      const r = restAt[q + '_' + m] || new Set();
      const used = new Set();
      POS.forEach(P => { if (main[P] && !r.has(P)) used.add(main[P].id); });
      POS.forEach(P => {
        if (main[P] && r.has(P)) {
          if (!filler[P] || used.has(filler[P])) {
            const pref = subs[P].filter(p => !used.has(p.id));
            const any = benchAll.filter(p => !used.has(p.id));
            const cand = pref.length ? pref : any;
            if (cand.length) filler[P] = fewest(cand).id;
            else { filler[P] = null; used.add(main[P].id); }   // 沒人可換，先發繼續打
          }
          if (filler[P]) used.add(filler[P]);
        } else if (main[P]) filler[P] = null;
        else {                                                 // 這個位置沒登記人，找空著的頂上
          const any = benchAll.filter(p => !used.has(p.id));
          filler[P] = any.length ? fewest(any).id : null;
          if (filler[P]) used.add(filler[P]);
        }
      });
      const lineup = POS.map(P => (main[P] && !r.has(P)) ? main[P].id : filler[P]).filter(Boolean);
      while (lineup.length < 5) {
        const any = ps.filter(p => !used.has(p.id));
        if (!any.length) break;
        const pk = fewest(any); lineup.push(pk.id); used.add(pk.id);
      }
      S.plan[q][m] = lineup;
      lineup.forEach(id => mins[id]++);
      prev = new Set(lineup);
    }
  });

  S.planAlgo = ALGO; S.stalePlan = false;
  S.planScen = SCEN[key].name + (onlyQ4 ? '（只換第 4 節）' : '（全場）');
  return true;
}

/* ═════════ 戰術板 ═════════
   座標單位＝0.1 公尺，FIBA 全場 28×15 公尺 → 150 寬 × 280 長（直式，進攻籃框在上方）。
   半場只畫 0～140。所有線條用內嵌屬性而非 CSS，匯出 PNG 時才不會掉色。      */
const CW = 150, CH = 140, RIM = [75, 15.75];
const INK = '#14171A', HI = '#C9F24D', RULE = '#9AA096', BALL = '#FF4438';

function halfCourt() {
  const arcY = (15.75 + Math.sqrt(67.5 * 67.5 - 66 * 66)).toFixed(1);   // 三分線直線段結束的位置
  return `
  <path d="M0 0H${CW}" stroke="${INK}" stroke-width="1" fill="none"/>
  <path d="M0 0V${CH}M${CW} 0V${CH}" stroke="${INK}" stroke-width="1" fill="none"/>
  <rect x="50.5" y="0" width="49" height="58" fill="none" stroke="${INK}" stroke-width="0.8"/>
  <path d="M57 58A18 18 0 0 0 93 58" fill="none" stroke="${INK}" stroke-width="0.8"/>
  <path d="M57 58A18 18 0 0 1 93 58" fill="none" stroke="${INK}" stroke-width="0.8" stroke-dasharray="3 2.5"/>
  <path d="M66 12H84" stroke="${INK}" stroke-width="1.4" fill="none"/>
  <path d="M75 12V13.5" stroke="${INK}" stroke-width="0.8"/>
  <circle cx="75" cy="15.75" r="2.25" fill="none" stroke="${INK}" stroke-width="0.8"/>
  <path d="M62.5 12V15.75A12.5 12.5 0 0 0 87.5 15.75V12" fill="none" stroke="${RULE}" stroke-width="0.7"/>
  <path d="M9 0V${arcY}A67.5 67.5 0 0 0 141 ${arcY}V0" fill="none" stroke="${INK}" stroke-width="0.8"/>`;
}
function courtSVG(full) {
  const H = full ? 280 : CH;
  const mid = full
    ? `<path d="M0 140H${CW}" stroke="${INK}" stroke-width="0.8"/><circle cx="75" cy="140" r="18" fill="none" stroke="${INK}" stroke-width="0.8"/>`
    : `<path d="M57 140A18 18 0 0 0 93 140" fill="none" stroke="${INK}" stroke-width="0.8"/><path d="M0 140H${CW}" stroke="${INK}" stroke-width="1"/>`;
  return `<svg class="board" id="board" viewBox="-9 -9 168 ${H + 18}" xmlns="http://www.w3.org/2000/svg">
    <rect x="-9" y="-9" width="168" height="${H + 18}" fill="#FFFFFF"/>
    <g>${halfCourt()}</g>
    ${full ? `<g transform="translate(150,280) rotate(180)">${halfCourt()}</g>` : ''}
    ${mid}
    <g id="marks"></g><g id="tokens"></g><g id="animationLayer"></g></svg>`;
}

/* ── 幾何小工具 ── */
const tot = p => p.reduce((a, q, i) => i ? a + Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) : 0, 0);
function along(p, s) {
  let rem = s;
  for (let i = 1; i < p.length; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], d = Math.hypot(x1 - x0, y1 - y0);
    if (!d) continue;
    if (rem <= d) return [x0 + (x1 - x0) * rem / d, y0 + (y1 - y0) * rem / d, (x1 - x0) / d, (y1 - y0) / d];
    rem -= d;
  }
  const a = p[p.length - 2] || p[0], b = p[p.length - 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  return [b[0], b[1], (b[0] - a[0]) / d, (b[1] - a[1]) / d];
}
const line = p => 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L');
function wavy(p) {                                   // 運球：波浪線
  const L = tot(p); let d = '';
  for (let s = 0, k = 0; s <= L; s += 2.4, k++) {
    const [x, y, ux, uy] = along(p, s), g = (k % 2 ? 1 : -1) * 1.9;
    d += (s ? 'L' : 'M') + (x - uy * g).toFixed(1) + ' ' + (y + ux * g).toFixed(1);
  }
  return d;
}
function head(p, kind, col = INK) {                  // 箭頭 / 掩護的橫桿
  const [x, y, ux, uy] = along(p, tot(p));
  if (kind === 'screen') return `<path d="M${(x - uy * 4).toFixed(1)} ${(y + ux * 4).toFixed(1)}L${(x + uy * 4).toFixed(1)} ${(y - ux * 4).toFixed(1)}" stroke="${col}" stroke-width="1.5" fill="none"/>`;
  const a = [x - ux * 5 - uy * 2.6, y - uy * 5 + ux * 2.6], b = [x - ux * 5 + uy * 2.6, y - uy * 5 - ux * 2.6];
  return `<polygon points="${x.toFixed(1)},${y.toFixed(1)} ${a[0].toFixed(1)},${a[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="${col}"/>`;
}
function markSVG(m, i) {
  const dash = m.t === 'pass' ? ' stroke-dasharray="4 3"' : '';
  const d = m.t === 'dribble' ? wavy(m.p) : line(m.p);
  const col = m.defense ? '#D92D20' : ({ dribble: '#2563EB', screen: '#EA580C', move: '#15803D', pass: '#7C3AED', pen: BALL }[m.t] || INK);
  return `<g data-mark="${i}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"${dash}/>`
    + (m.t === 'pen' ? '' : head(m.p, m.t, col)) + `</g>`;
}
function tokenSVG(t, i) {
  const F = 'Helvetica Neue,Arial,PingFang TC,Noto Sans TC,sans-serif';
  if (t.ball) return `<g data-tok="${i}" transform="translate(${t.x},${t.y}) scale(.82)">
    <circle r="12" fill="transparent" pointer-events="all"/>
    <circle r="6.5" fill="${BALL}" stroke="${INK}" stroke-width="0.9"/>
    <path d="M-5.4 0H5.4M0-5.4V5.4M-3.8-3.8Q0 0 3.8 3.8M3.8-3.8Q0 0-3.8 3.8" fill="none" stroke="${INK}" stroke-width="0.55"/></g>`;
  if (t.d) return `<g data-tok="${i}" transform="translate(${t.x},${t.y}) scale(.82)">
    <circle r="12" fill="transparent" pointer-events="all"/>
    <circle r="6.5" fill="${BALL}" stroke="${INK}" stroke-width="0.9"/>
    <path d="M-2.7 -2.7L2.7 2.7M2.7 -2.7L-2.7 2.7" stroke="#FFFFFF" stroke-width="1.25"/>
    <text y="11" text-anchor="middle" font-size="4.2" font-weight="700" fill="${INK}" font-family="${F}">D${esc(t.no || String(i + 1))}</text></g>`;
  return `<g data-tok="${i}" transform="translate(${t.x},${t.y}) scale(.82)">
    <circle r="12" fill="transparent" pointer-events="all"/>
    <circle r="6.5" fill="${HI}" stroke="${INK}" stroke-width="0.9"/>
    <text y="2.3" text-anchor="middle" font-size="6.4" font-weight="700" fill="${INK}" font-family="${F}">${esc(t.no || '')}</text>
    <text y="11" text-anchor="middle" font-size="4.1" fill="${INK}" font-family="${F}">${esc(t.name || '')}</text></g>`;
}

let animState = { running: false, startAt: 0, elapsed: 0, duration: 0, raf: 0, events: [], base: [], ballStart: [75, 105] };
function animationPlan() {
  const b = activeBoard();
  const base = b.tokens.map(t => Object.assign({}, t));
  const positions = base.map(t => [t.x, t.y]);
  const events = [];
  let ball = null, ballStart = null, cursor = 0;
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const durationOf = pts => Math.max(.65, Math.min(1.8, tot(pts) / 48));
  const phases = new Map();
  b.marks.forEach((mark, i) => {
    const key = mark.phase === undefined ? `single-${i}` : `phase-${mark.phase}`;
    if (!phases.has(key)) phases.set(key, []);
    phases.get(key).push(mark);
  });
  phases.forEach(marks => {
    let phaseDuration = 0;
    marks.forEach(mark => {
      if (!Array.isArray(mark.p) || mark.p.length < 2) return;
      if (mark.t === 'move') {
      let actor = Number.isInteger(mark.actorIndex) && base[mark.actorIndex] ? mark.actorIndex : -1;
      if (actor < 0) {
        let nearest = Infinity;
        positions.forEach((p, i) => { const d = dist(p, mark.p[0]); if (d < nearest) { nearest = d; actor = i; } });
      }
      if (actor < 0 || !base[actor]) return;
      const pts = mark.p.map(p => p.slice());
      if (dist(positions[actor], pts[0]) > 3) pts.unshift(positions[actor].slice());
      const duration = durationOf(pts);
      events.push({ kind: 'player', actor, pts, start: cursor, duration });
      phaseDuration = Math.max(phaseDuration, duration); positions[actor] = pts[pts.length - 1].slice();
      } else if (mark.t === 'dribble' || mark.t === 'pass') {
      const pts = mark.p.map(p => p.slice());
      if (ball && dist(ball, pts[0]) > 3) pts.unshift(ball.slice());
      if (!ball) { ball = pts[0].slice(); ballStart = ball.slice(); }
      const duration = durationOf(pts);
        let actor = Number.isInteger(mark.actorIndex) && base[mark.actorIndex] && !base[mark.actorIndex].d ? mark.actorIndex : -1;
        if (mark.t === 'dribble' && actor < 0) {
          let nearest = Infinity;
          positions.forEach((p, i) => {
            if (base[i].d) return;
            const d = dist(p, pts[0]); if (d < nearest) { nearest = d; actor = i; }
          });
        }
        const kind = mark.t === 'dribble' && actor >= 0 ? 'dribble' : 'ball';
        events.push({ kind, actor, pts, start: cursor, duration });
        phaseDuration = Math.max(phaseDuration, duration); ball = pts[pts.length - 1].slice();
        if (kind === 'dribble') positions[actor] = pts[pts.length - 1].slice();
      }
    });
    cursor += phaseDuration;
  });
  return { base, events, duration: cursor, ballStart: ballStart || [75, 105] };
}
function pointOnPath(pts, t) {
  const length = tot(pts); if (!length) return pts[pts.length - 1].slice();
  let remain = length * Math.max(0, Math.min(1, t));
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (!d) continue;
    if (remain <= d) return [a[0] + (b[0] - a[0]) * remain / d, a[1] + (b[1] - a[1]) * remain / d];
    remain -= d;
  }
  return pts[pts.length - 1].slice();
}
function drawAnimationAt(seconds) {
  const layer = document.getElementById('animationLayer'); if (!layer) return;
  const positions = animState.base.map(t => [t.x, t.y]);
  let ball = animState.ballStart.slice();
  for (const ev of animState.events) {
    if (seconds >= ev.start + ev.duration) {
      if (ev.kind === 'player' || ev.kind === 'dribble') positions[ev.actor] = ev.pts[ev.pts.length - 1].slice();
      else ball = ev.pts[ev.pts.length - 1].slice();
      if (ev.kind === 'dribble') ball = [ev.pts[ev.pts.length - 1][0] + 4, ev.pts[ev.pts.length - 1][1] + 4];
    } else if (seconds >= ev.start) {
      const p = pointOnPath(ev.pts, (seconds - ev.start) / ev.duration);
      if (ev.kind === 'player' || ev.kind === 'dribble') positions[ev.actor] = p;
      if (ev.kind === 'dribble') ball = [p[0] + 4, p[1] + 4];
      else if (ev.kind === 'ball') ball = p;
    }
  }
  const tokens = animState.base.map((t, i) => tokenSVG(Object.assign({}, t, { x: positions[i][0], y: positions[i][1] }), i)).join('');
  layer.innerHTML = `<g id="animPlayers" pointer-events="none">${tokens}</g>
    <g id="animBall" transform="translate(${ball[0]},${ball[1]})" pointer-events="none">
      <circle r="4.3" fill="${BALL}" stroke="${INK}" stroke-width=".8"/>
      <path d="M-3.2 -1.8Q0 0 3.2 1.8M-1.8 -3.2Q0 0 1.8 3.2" fill="none" stroke="${INK}" stroke-width=".45"/>
    </g>`;
  const clock = document.getElementById('animClock');
  if (clock) clock.textContent = `${Math.min(seconds, animState.duration).toFixed(1)}s / ${animState.duration.toFixed(1)}s`;
}
function updateAnimButton() {
  const b = document.getElementById('animToggle'); if (!b) return;
  b.textContent = animState.running ? 'Ⅱ 暫停' : animState.elapsed >= animState.duration && animState.duration ? '↻ 重播' : animState.elapsed ? '▶ 繼續' : '▶ 播放走位';
}
function animationFrame(now) {

  }

}

  }
  if (!animState.events.length || animState.elapsed >= animState.duration) {
    const plan = animationPlan();
    if (!plan.events.length) { alert('這個戰術還沒有可播放的移動、運球或傳球線。用「移動」、「運球」或「傳球」畫線後即可播放。'); return; }
    animState = Object.assign(animState, plan, { elapsed: 0 });
  }
  const tokens = document.getElementById('tokens'); if (tokens) tokens.setAttribute('opacity', '.22');

  animState.raf = requestAnimationFrame(animationFrame);
}
function resetAnimation() {
  if (animState.raf) cancelAnimationFrame(animState.raf);
  animState.running = false; animState.elapsed = 0; animState.duration = 0; animState.events = []; animState.base = [];
  const tokens = document.getElementById('tokens'); if (tokens) tokens.setAttribute('opacity', '1');
  const layer = document.getElementById('animationLayer'); if (layer) layer.innerHTML = '';
  const clock = document.getElementById('animClock'); if (clock) clock.textContent = '球與人依畫線順序播放';

/* ═════════ 即時計時 ═════════ */
const elapsed = () => S.lv.acc + (S.lv.running ? Date.now() - S.lv.startedAt : 0);
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
function startClock() {
  if (S.lv.running || elapsed() >= S.qMin * 60000) return;
  S.lv.startedAt = Date.now(); S.lv.running = true;
  keepAwake(true); save(true); render();
}
function pauseClock() {
  if (!S.lv.running) return;
  S.lv.acc = elapsed(); S.lv.running = false; S.lv.startedAt = null;
  keepAwake(false); save(true); render();
}
function tick() {
  if (S.tab !== 'live') return;
  const el = elapsed();
  const done = Math.min(S.qMin, Math.floor(el / 60000));
  if (done > S.lv.written) {
    for (let m = S.lv.written; m < done; m++) S.live[S.lv.q][m] = S.lv.onCourt.slice();
    S.lv.written = done; save(true); render(); return;
  }
  if (el >= S.qMin * 60000 && S.lv.running) { pauseClock(); return; }
  const t = document.getElementById('clockT');
  if (t) t.textContent = clockText(el);
  if (S.lv.running && el % 4000 < 400) { S.lv.acc = el; S.lv.startedAt = Date.now(); save(); }
}
setInterval(tick, 400);
function clockText(el) {
  const s = Math.ceil(Math.max(0, S.qMin * 60000 - el) / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* 某位置沒有輪替 → 那個先發會被排滿 40/48 分，先講清楚 */
function posGaps() {
  const ps = actives(), msg = [];
  const guards = ps.filter(p => p.pos === 'PG' || p.pos === 'SG');
  const noOne = ['SF', 'PF', 'C'].filter(P => !ps.some(p => p.pos === P));
  if (!guards.length) noOne.unshift('PG／SG');
  if (noOne.length) msg.push(`${noOne.join('、')} 沒有登記任何人，會由其他位置的人頂上。`);
  const noSub = ['SF', 'PF', 'C'].filter(P => {
    const group = ps.filter(p => p.pos === P);
    return group.length && !group.some(p => p.role === 'R');
  });
  if (guards.length && !guards.some(p => p.role === 'R')) noSub.unshift('PG／SG');
  if (noSub.length) msg.push(`${noSub.join('、')} 沒有輪替，相關先發可能會被排較多分鐘。`);
  return msg;
}

function pickFive() {                                // 誰要放上戰術板
  const ps = actives();
  const on = ps.filter(p => S.lv.onCourt.indexOf(p.id) >= 0);
  if (on.length >= 5) return on.slice(0, 5);
  const five = ps.filter(p => p.role === 'S').slice(0, 5);
  ps.forEach(p => { if (five.length < 5 && five.indexOf(p) < 0) five.push(p); });
  return five;
}
function spotsToTokens(spots) {
  const five = pickFive(), used = new Set();
  return spots.map(([pos, x, y], i) => {
    const p = five.find(q => q.pos === pos && !used.has(q.id)) || five.find(q => !used.has(q.id));
    if (p) used.add(p.id);
    return { x, y, no: p ? (p.no || String(i + 1)) : String(i + 1), name: p ? p.name.trim() : pos };
  });
}
function ensureFreeBoard() {
  const b = S.freeBoard;
  if (b.tokens.length) return;
  b.tokens = spotsToTokens([
    ['PG', 75, 112], ['SG', 9, 23], ['SF', 141, 23], ['PF', 55, 53], ['C', 95, 53]
  ]).concat([{ ball: true, x: 80, y: 111 }]);
  b.marks = []; b.play = '';
}
const PLAY_VERSION = 4;
function setBuiltinPlay(i) {
  const pl = PLAYS[i]; if (!pl) return;
  const b = S.board, offense = spotsToTokens(pl.spots);
  const defense = (pl.defense || []).map(([x, y], j) => ({ d: 1, no: String(j + 1), x, y }));
  b.tokens = offense.concat(defense);
  b.marks = pl.marks.map(m => ({ t: m.t, p: m.p.map(q => q.slice()), actorIndex: m.actorIndex, phase: m.phase }));
  (pl.defenseMoves || []).forEach(m => b.marks.push({
    t: 'move', p: m.p.map(q => q.slice()), actorIndex: offense.length + m.defender,
    phase: m.phase, defense: true
  }));
  b.full = false; b.play = 'p' + i; b.playVersion = PLAY_VERSION;
}
function loadPlay(src, i) {

}

function drawMarks(tmp) {
  const g = document.getElementById('marks'); if (!g) return;
  g.innerHTML = activeBoard().marks.map(markSVG).join('') + (tmp && tmp.p.length > 1 ? markSVG(tmp, -1) : '');
}
function drawTokens() {
  const g = document.getElementById('tokens'); if (!g) return;
  g.innerHTML = activeBoard().tokens.map(tokenSVG).join('');
}
function initBoard() {
  const svg = document.getElementById('board'); if (!svg) return;
  const b = activeBoard();
  const free = S.boardMode === 'free';
  const pt = e => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return [+(vb.x + (e.clientX - r.left) / r.width * vb.width).toFixed(1),
            +(vb.y + (e.clientY - r.top) / r.height * vb.height).toFixed(1)];
  };
  const nearestToken = (x, y, maxDistance) => {
    let best = null, bestDistance = maxDistance;
    b.tokens.forEach((t, i) => {
      const distance = Math.hypot(t.x - x, t.y - y);
      if (distance <= bestDistance) { best = i; bestDistance = distance; }
    });
    return best;
  };
  let drag = null, stroke = null;

  svg.addEventListener('pointerdown', e => {
    resetAnimation();
    const [x, y] = pt(e), tk = e.target.closest('[data-tok]');
    let tokenIndex = tk ? +tk.dataset.tok : null;
    if (b.tool === 'erase') {                        // 點最近的一條線把它擦掉
      let bi = -1, bd = 9e9;
      b.marks.forEach((m, i) => m.p.forEach(q => {
        const d = Math.hypot(q[0] - x, q[1] - y); if (d < bd) { bd = d; bi = i; }
      }));
      if (bi >= 0 && bd < 10) { b.marks.splice(bi, 1); drawMarks(); save(true); }
      return;
    }
    if (tokenIndex === null && (free || b.tool === 'drag')) tokenIndex = nearestToken(x, y, 14);

    // In free mode, touching a token always means drag. Draw from just beside it,
    // so a missed hit cannot accidentally create a line instead of moving it.
    if (tokenIndex !== null && (b.tool === 'drag' || (free && tk))) {
      drag = tokenIndex; svg.setPointerCapture(e.pointerId); return;
    }
    // The drag tool is strictly for moving tokens; a drag on empty court is a no-op.
    if (b.tool === 'drag') return;

    const actorIndex = free && b.tool !== 'pen' ? tokenIndex : (tk ? +tk.dataset.tok : null);
    const from = actorIndex !== null ? [b.tokens[actorIndex].x, b.tokens[actorIndex].y] : [x, y];
    stroke = { t: b.tool, p: [from], actorIndex };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    const [x, y] = pt(e);
    if (drag !== null) { b.tokens[drag].x = x; b.tokens[drag].y = y; drawTokens(); return; }
    if (stroke) {
      const l = stroke.p[stroke.p.length - 1];
      if (Math.hypot(x - l[0], y - l[1]) > 2.4) { stroke.p.push([x, y]); drawMarks(stroke); }
    }
  });
  const end = () => {
    if (stroke) { if (stroke.p.length > 1) b.marks.push(stroke); stroke = null; drawMarks(); }
    drag = null; save(true);
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  drawMarks(); drawTokens();
}
function pngBoard() {
  const svg = document.getElementById('board'); if (!svg) return;
  const vb = svg.viewBox.baseVal, sc = 4;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = vb.width * sc; c.height = vb.height * sc;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(bl => {
      if (!bl) { alert('這個瀏覽器不支援轉存圖片，請直接截圖。'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(bl);
      a.download = '戰術_' + new Date().toISOString().slice(0, 10) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  };
  img.onerror = () => alert('這個瀏覽器不支援轉存圖片，請直接截圖。');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
}

/* ═════════ 互動 ═════════ */
const undoStack = [];
const pushUndo = src => {
  undoStack.push({ src, data: JSON.stringify(S[src]) });
  if (undoStack.length > 30) undoStack.shift();
};

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  resetAnimation();
  S.tab = b.dataset.tab; save(); render();
});

view.addEventListener('click', e => {
  const applyT = e.target.closest('[data-template-apply]');
  if (applyT) { applyTemplate(+applyT.dataset.templateApply); return; }
  const deleteT = e.target.closest('[data-template-delete]');
  if (deleteT) {
    const i = +deleteT.dataset.templateDelete;
    if (confirm(`刪除模板「${S.templates[i].name}」？`)) {
      S.templates.splice(i, 1); save(true); render();
    }
    return;
  }
  const sub = e.target.closest('[data-sub]');
  if (sub) {
    const id = sub.dataset.sub, i = S.lv.onCourt.indexOf(id);
    i >= 0 ? S.lv.onCourt.splice(i, 1) : S.lv.onCourt.push(id);
    save(true); render(); return;
  }
  const q = e.target.closest('[data-q]');
  if (q) { S.gq = +q.dataset.q; save(); render(); return; }
  const sc = e.target.closest('[data-scope]');
  if (sc) { S.scope = sc.dataset.scope; save(); render(); return; }

  // ── 戰術板 ──
  const bm = e.target.closest('[data-board-mode]');
  if (bm) {
    resetAnimation(); S.boardMode = bm.dataset.boardMode === 'free' ? 'free' : 'library';
    if (S.boardMode === 'free') ensureFreeBoard();
    save(true); render(); return;
  }
  const pl = e.target.closest('[data-play]');
  if (pl) { loadPlay('p', +pl.dataset.play); return; }
  const mp = e.target.closest('[data-myplay]');
  if (mp) { loadPlay('m', +mp.dataset.myplay); return; }
  const dp = e.target.closest('[data-delplay]');
  if (dp) {
    const i = +dp.dataset.delplay;
    if (confirm(`刪除自訂戰術「${S.plays[i].name}」？`)) {
      S.plays.splice(i, 1); if (S.board.play === 'm' + i) S.board.play = '';
      save(true); render();
    }
    return;
  }
  const cv = e.target.closest('[data-court]');
  if (cv) { resetAnimation(); activeBoard().full = cv.dataset.court === '1'; save(); render(); return; }
  const tl = e.target.closest('[data-tool]');
  if (tl) {
    const k = tl.dataset.tool;
    if (k === '*clear') {
      if (activeBoard().marks.length && !confirm('清掉板子上所有畫的線？')) return;
      resetAnimation(); activeBoard().marks = []; drawMarks(); save(true); return;
    }
    resetAnimation();
    activeBoard().tool = k;
    document.querySelectorAll('[data-tool]').forEach(x =>
      x.setAttribute('aria-selected', String(x.dataset.tool === k)));
    return;
  }

  const sn = e.target.closest('[data-scen]');
  if (sn) {
    const k = sn.dataset.scen, onlyQ4 = S.scope === 'q4';
    const used = S.plan.some((qq, i) => (onlyQ4 ? i === 3 : true) && qq.some(m => m.length));
    if (used && !confirm(`會覆蓋${onlyQ4 ? '第 4 節' : '整張'}預排表，改用「${SCEN[k].name}」。要繼續嗎？（可以按復原還原）`)) return;
    pushUndo('plan');
    if (autoPlan(k, onlyQ4)) { if (onlyQ4) S.gq = 3; save(true); render(); }
    return;
  }

  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;

  if (act === 'animToggle') toggleAnimation();
  else if (act === 'animReset') resetAnimation();
  else if (act === 'toggleClock') S.lv.running ? pauseClock() : startClock();
  else if (act === 'nextQ') {
    pauseClock();
    if (S.lv.written < S.qMin && !confirm(`第 ${S.lv.q + 1} 節只記錄了 ${S.lv.written} 分，還沒滿 ${S.qMin} 分。直接進下一節嗎？`)) return;
    S.lv.q = Math.min(3, S.lv.q + 1); S.lv.acc = 0; S.lv.written = 0; S.gq = S.lv.q;
    save(true); render();
  }
  else if (act === 'resetLive') {
    if (!confirm('清空「即時」的所有紀錄與計時？（預排表不受影響）')) return;
    pauseClock(); S.live = blankGrid(S.qMin);
    S.lv = Object.assign(defaults().lv, { onCourt: S.lv.onCourt });
    save(true); render();
  }
  else if (act === 'toggleLiveGrid') { S.showLiveGrid = !S.showLiveGrid; S.gq = S.lv.q; save(); render(); }
  else if (act === 'undo') {
    const u = undoStack.pop(); if (!u) return;
    S[u.src] = JSON.parse(u.data); save(true); render();
  }
  else if (act === 'clearQ') {
    if (!confirm(`清空預排第 ${S.gq + 1} 節？`)) return;
    pushUndo('plan'); S.plan[S.gq] = Array.from({ length: S.qMin }, () => []); save(true); render();
  }
  else if (act === 'copyPrevQ') { pushUndo('plan'); S.plan[S.gq] = S.plan[S.gq - 1].map(a => a.slice()); save(true); render(); }
  else if (act === 'fmt') {
    const v = +b.dataset.v; if (v === S.fmt) return;
    const used = ['plan', 'live'].some(s => S[s].some(qq => qq.some(m => m.length)));
    if (used && !confirm('改賽制會清空預排表與即時紀錄，確定？')) return;
    S.fmt = v === 48 ? 48 : 40; S.qMin = S.fmt === 48 ? 12 : 10;
    S.flex.restMin = Math.min(S.qMin - 1, S.flex.restMin);
    S.plan = blankGrid(S.qMin); S.live = blankGrid(S.qMin);
    S.lv = Object.assign(defaults().lv, { onCourt: S.lv.onCourt });
    undoStack.length = 0; save(true); render();
  }
  else if (act === 'wipe') {
    if (!confirm('清除名單、預排與紀錄，全部歸零？')) return;
    localStorage.removeItem(LS); localStorage.removeItem(LS_OLD); S = defaults(); render();
  }
  else if (act === 'undoMark') { resetAnimation(); activeBoard().marks.pop(); drawMarks(); save(true); }
  else if (act === 'toggleDef') {
    resetAnimation();
    const b = activeBoard();
    if (b.tokens.some(t => t.d)) b.tokens = b.tokens.filter(t => !t.d);
    else {
  const spots = [[56, 56], [94, 56], [56, 31], [94, 31], [75, 22]];
      b.tokens = b.tokens.concat(spots.map(([x, y], i) => ({ d: 1, no: String(i + 1), x, y })));
    }
    save(true); render();
  }
  else if (act === 'loadFive') {
    resetAnimation();
    const five = pickFive();
    if (!five.length) { alert('名單還是空的，先到「名單」頁填人。'); return; }
    activeBoard().tokens.filter(t => !t.d && !t.ball).forEach((t, i) => {
      const p = five[i];
      if (p) { t.no = p.no || String(i + 1); t.name = p.name.trim(); }
    });
    save(true); render();
  }
  else if (act === 'savePlay') {
    resetAnimation();
    const board = activeBoard();
    const suggested = S.boardMode === 'library' && board.play.startsWith('p') ? PLAYS[+board.play.slice(1)].name + ' 改' : '我的戰術';
    const n = prompt('這個戰術叫什麼？', suggested);
    if (!n) return;
    S.plays.push({ name: n.slice(0, 12), full: board.full,
      tokens: board.tokens.map(t => Object.assign({}, t)),
      marks: board.marks.map(m => ({ t: m.t, p: m.p.map(q => q.slice()), actorIndex: m.actorIndex, phase: m.phase, defense: m.defense })) });
    if (S.boardMode === 'library') board.play = 'm' + (S.plays.length - 1);
    save(true); render();
  }
  else if (act === 'pngBoard') pngBoard();
  else if (act === 'saveTemplate') {
    const name = prompt('替目前配置取個模板名稱：', '社區賽');
    if (!name || !name.trim()) return;
    S.templates.push(captureTemplate(name.trim().slice(0, 32)));
    save(true); render(); alert('比賽模板已儲存。');
  }
  else if (act === 'csv') downloadCSV();
  else if (act === 'copy') copyTable();
  else if (act === 'expRoster') exportRoster();
  else if (act === 'impRoster') document.getElementById('impFile').click();
  else if (act === 'impPaste') {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(t => {
        if (t.trim().startsWith('{')) applyRoster(t);
        else {
          const pasted = prompt('剪貼簿沒有找到 JSON。請貼上匯出的名單文字：');
          if (pasted) applyRoster(pasted);
        }
      }).catch(() => {
        const pasted = prompt('請貼上匯出的名單文字：');
        if (pasted) applyRoster(pasted);
      });
    } else {
      const pasted = prompt('請貼上匯出的名單文字：');
      if (pasted) applyRoster(pasted);
    }
  }
});

view.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f !== undefined) {
    const p = S.roster[+t.dataset.i];
    p[t.dataset.f] = t.dataset.f === 'no' ? t.value.replace(/\D/g, '').slice(0, 3) : t.value;
    if (t.dataset.f === 'no') t.value = p.no;
    save();
  } else if (t.dataset.w) {
    const v = parseFloat(t.value);
    S.w[t.dataset.w] = isNaN(v) || v < 0 ? 0 : v;
    save();
  } else if (t.dataset.flex) {
    const max = t.dataset.flex === 'restMin' ? S.qMin - 1 : 5;
    const min = t.dataset.flex === 'restMin' ? 0 : 1;
    const value = Math.floor(+t.value || 0);
    S.flex[t.dataset.flex] = Math.min(max, Math.max(min, value));
    t.value = S.flex[t.dataset.flex];
    save();
  }
});
view.addEventListener('change', e => {          // select 只發 change
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.f) { S.roster[+t.dataset.i][t.dataset.f] = t.value; save(true); render(); }
  else if (t.dataset.f === 'no') { S.roster[+t.dataset.i].no = t.value.replace(/\D/g, '').slice(0, 3); t.value = S.roster[+t.dataset.i].no; save(true); }
  else if (t.dataset.flex) save(true);
});

/* ── 塗格子：按住橫向拖曳連塗 ── */
let paint = null;
view.addEventListener('pointerdown', e => {
  const c = e.target.closest('.cell'); if (!c) return;
  const g = c.closest('.grid');
  pushUndo(g.dataset.src);
  paint = { src: g.dataset.src, on: !c.classList.contains('on') };
  applyCell(c);
  try { g.setPointerCapture(e.pointerId); } catch (err) {}
});
view.addEventListener('pointermove', e => {
  if (!paint) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest ? el.closest('.cell') : null;
  if (c) applyCell(c);
});
['pointerup', 'pointercancel'].forEach(ev =>
  window.addEventListener(ev, () => { if (paint) { paint = null; save(true); decorate(); } }));
function applyCell(c) {
  const arr = S[paint.src][S.gq][+c.dataset.m], pid = c.dataset.pid, i = arr.indexOf(pid);
  if (paint.on && i < 0) arr.push(pid);
  else if (!paint.on && i >= 0) arr.splice(i, 1);
  else return;
  c.classList.toggle('on', paint.on);
}

/* ── 匯出／匯入 ── */
function dl(text, name, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function captureTemplate(name) {
  return {
    name, savedAt: new Date().toISOString(), fmt: S.fmt, qMin: S.qMin,
    roster: S.roster.map(p => Object.assign({}, p)), w: Object.assign({}, S.w),
    flex: Object.assign({}, S.flex), plan: S.plan.map(q => q.map(m => m.slice())),
    planScen: S.planScen, planAlgo: S.planAlgo, plays: JSON.parse(JSON.stringify(S.plays))
  };
}
function applyTemplate(i) {
  const t = S.templates[i]; if (!t) return;
  if (!confirm(`套用「${t.name}」？會替換賽制、名單、預排和自訂戰術，並清除目前的即時紀錄。`)) return;
  const migrated32 = +t.fmt === 32 || +t.qMin === 8;
  S.fmt = +t.fmt === 48 ? 48 : 40;
  S.qMin = migrated32 ? 10 : (S.fmt === 48 ? 12 : 10);
  S.roster = (t.roster || []).slice(0, 15).map((p, j) => ({
    id: p.id || uid(), no: String(p.no || '').replace(/\D/g, '').slice(0, 3),
    name: String(p.name || ''), pos: POS.includes(p.pos) ? p.pos : POS[j % 5], role: p.role === 'S' ? 'S' : 'R'
  }));
  while (S.roster.length < 15) S.roster.push({ id: uid(), no: '', name: '', role: 'R', pos: POS[S.roster.length % 5] });
  S.w = { S: +(t.w && t.w.S) || 1.5, R: +(t.w && t.w.R) || 1 };
  S.flex = Object.assign(defaults().flex, t.flex || {});
  S.flex.restMin = Math.min(S.qMin - 1, Math.max(0, Math.floor(+S.flex.restMin || 0)));
  S.flex.restStarters = Math.min(5, Math.max(1, Math.floor(+S.flex.restStarters || 1)));
  S.plan = fitGrid(t.plan, S.qMin); S.planScen = t.planScen || '';
  S.planAlgo = t.planAlgo || ALGO; S.stalePlan = (migrated32 || S.planAlgo !== ALGO) && S.plan.some(q => q.some(m => m.length));
  S.plays = Array.isArray(t.plays) ? JSON.parse(JSON.stringify(t.plays)) : [];
  S.live = blankGrid(S.qMin); S.lv = defaults().lv; S.board = defaults().board;
  S.tab = 'plan'; S.gq = 0; undoStack.length = 0;
  save(true); render();
}
async function exportRoster() {
  const data = {
    app: 'hoop-rotation', v: 3, fmt: S.fmt, qMin: S.qMin, w: S.w, flex: S.flex,
    roster: S.roster.map(p => Object.assign({}, p)),
    plan: S.plan.map(q => q.map(m => m.slice())), planScen: S.planScen, planAlgo: S.planAlgo,
    plays: S.plays, templates: S.templates
  };
  const txt = JSON.stringify(data);
  const name = `比賽備份_${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([txt], name, { type: 'application/json' });
  try {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ title: '籃球輪替完整備份', files: [file] });
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
      return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  dl(txt, name, 'application/json');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
    () => alert('完整備份已下載，JSON 文字也已複製。'),
    () => alert('完整備份已下載。'));
}
function applyRoster(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { alert('讀不到內容，這不是匯出的名單檔。'); return; }
  if (!d || !Array.isArray(d.roster)) { alert('檔案裡沒有名單資料。'); return; }
  if (!confirm(`匯入 ${d.roster.filter(p => p && (p.no || p.name)).length} 位球員？目前賽制、名單、預排與自訂戰術會被取代，即時紀錄會清空。`)) return;
  const migrated32 = +d.fmt === 32 || +d.qMin === 8;
  S.fmt = +d.fmt === 48 ? 48 : 40;
  S.qMin = S.fmt === 48 && !migrated32 ? 12 : 10;
  S.w = { S: +(d.w && d.w.S) || 1.5, R: +(d.w && d.w.R) || 1 };
  S.roster = d.roster.slice(0, 15).map((p, i) => ({
    id: d.v >= 3 && p.id ? String(p.id) : uid(), no: String(p.no || '').replace(/\D/g, '').slice(0, 3), name: String(p.name || ''),
    pos: POS.indexOf(p.pos) >= 0 ? p.pos : POS[i % 5], role: p.role === 'S' ? 'S' : 'R'
  }));
  while (S.roster.length < 15) S.roster.push({ id: uid(), no: '', name: '', role: 'R', pos: POS[S.roster.length % 5] });
  if (Array.isArray(d.plays)) S.plays = d.plays;
  S.flex = Object.assign(defaults().flex, d.flex || {});
  S.flex.restMin = Math.min(S.qMin - 1, Math.max(0, Math.floor(+S.flex.restMin || 0)));
  S.flex.restStarters = Math.min(5, Math.max(1, Math.floor(+S.flex.restStarters || 1)));
  S.plan = d.v >= 3 ? fitGrid(d.plan, S.qMin) : blankGrid(S.qMin);
  S.planScen = d.planScen || ''; S.planAlgo = d.planAlgo || ALGO;
  S.stalePlan = (migrated32 || S.planAlgo !== ALGO) && S.plan.some(q => q.some(m => m.length));
  if (Array.isArray(d.templates)) S.templates = d.templates;
  S.live = blankGrid(S.qMin);
  S.lv = defaults().lv; S.board = defaults().board; S.gq = 0; S.tab = 'setup'; undoStack.length = 0;
  save(true); render();
  alert('完整備份已匯入。');
}
document.getElementById('impFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => applyRoster(String(r.result));
  r.onerror = () => alert('檔案讀取失敗，改用「貼上文字匯入」試試。');
  r.readAsText(f); e.target.value = '';
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}

function tableRows() {
  const sug = suggestions();
  const head = ['背號', '姓名', '位置', '角色', '建議',
    ...[1, 2, 3, 4].map(i => '預排Q' + i), '預排總', ...[1, 2, 3, 4].map(i => '實際Q' + i), '實際總'];
  const body = actives().map(p => {
    const pl = minutesOf('plan', p.id), lv = minutesOf('live', p.id);
    return [p.no, p.name.trim() || '未命名', p.pos, ROLES[p.role], sug[p.id], ...pl.q, pl.total, ...lv.q, lv.total];
  });
  return [head, ...body];
}
function downloadCSV() {
  const csv = '\uFEFF' + tableRows().map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  dl(csv, `上場時間_${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv');
}
function copyTable() {
  const txt = tableRows().map(r => r.join('\t')).join('\n');
  const done = () => alert('已複製，可直接貼到 LINE 或試算表。');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => prompt('手動複製：', txt));
  else prompt('手動複製：', txt);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.lv.running) keepAwake(true);
});

render();
</script>
